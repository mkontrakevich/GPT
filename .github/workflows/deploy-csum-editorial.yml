name: Deploy CSUM Editorial Engine
on:
  push:
    branches: [csum-nn-site]
    paths:
      - "workers/csum-source-collector/**"
      - ".github/workflows/deploy-csum-editorial.yml"
  workflow_dispatch:
  schedule:
    - cron: '17 4,16 * * *'
concurrency:
  group: csum-editorial-production
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/csum-source-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set OpenRouter secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
      - name: Set admin token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CSUM_ADMIN_TOKEN: ${{ secrets.CSUM_ADMIN_TOKEN }}
        run: printf '%s' "$CSUM_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
      - name: E2E
        env:
          CSUM_ADMIN_TOKEN: ${{ secrets.CSUM_ADMIN_TOKEN }}
        run: |
          curl -fsS https://csum-nn-source-collector.kontrakevich.workers.dev/health
          curl -fsS -X POST -H "X-CSUM-Admin-Token: $CSUM_ADMIN_TOKEN" https://csum-nn-source-collector.kontrakevich.workers.dev/api/sources/refresh > /tmp/refresh.json
          cat /tmp/refresh.json
          curl -fsS https://csum-nn-source-collector.kontrakevich.workers.dev/api/facts
          curl -fsS https://csum-nn-source-collector.kontrakevich.workers.dev/api/content-plan
          articles="$(curl -fsS https://csum-nn-source-collector.kontrakevich.workers.dev/api/articles)"
          printf '%s' "$articles" | jq -e '(.articles|length) > 0 and all(.articles[]; .schema_version == 3 and (.sources|length) > 0 and (.visual.mode|type) == "string")' >/dev/null
          printf '%s' "$articles"
          image_health="$(curl -fsS https://csum-nn-image-studio.kontrakevich.workers.dev/health)"
          printf '%s' "$image_health" | jq -e '.ok == true and .r2 == true and .openrouter == true' >/dev/null
          test_id="editorial-e2e-$(date +%s)"
          generated="$(curl -sS -X POST -H "Content-Type: application/json" -H "X-CSUM-Admin-Token: $CSUM_ADMIN_TOKEN" https://csum-nn-image-studio.kontrakevich.workers.dev/api/generate --data "$(jq -nc --arg id "$test_id" '{id:$id,prompt:"Editorial E2E smoke test: abstract architectural light and shadow, no text, no logos",aspect_ratio:"16:9",output_format:"webp"}')")"
          printf '%s' "$generated" | jq -e '.ok == true and (.candidate_key|length) > 0 or (.error|tostring|test("Insufficient credits"))' >/dev/null

  refresh:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Scheduled editorial refresh
        env:
          CSUM_ADMIN_TOKEN: ${{ secrets.CSUM_ADMIN_TOKEN }}
        run: |
          before="$(curl -fsS https://csum-nn-source-collector.kontrakevich.workers.dev/api/articles)"
          before_total="$(printf '%s' "$before" | jq -r '.cost.total_usd // 0')"
          curl --retry 2 --max-time 540 -fsS -X POST -H "X-CSUM-Admin-Token: $CSUM_ADMIN_TOKEN" https://csum-nn-source-collector.kontrakevich.workers.dev/api/sources/refresh > /tmp/refresh.json
          cat /tmp/refresh.json
          after="$(curl -fsS https://csum-nn-source-collector.kontrakevich.workers.dev/api/articles)"
          printf '%s' "$after" | jq -e '(.articles|length) > 0 and all(.articles[]; .schema_version == 3 and (.sources|length) > 0)' >/dev/null
          printf '%s' "$after" | jq -e '[.articles[].title|ascii_downcase] | length == (unique|length)' >/dev/null
          after_total="$(printf '%s' "$after" | jq -r '.cost.total_usd // 0')"
          cycle="$(printf '%s' "$after" | jq -r '.cost.cycle_usd // 0')"
          echo "OPENROUTER_COST_CYCLE_USD=$cycle"
          echo "OPENROUTER_COST_TOTAL_USD=$after_total"
          awk "BEGIN {exit !($after_total >= $before_total)}"
