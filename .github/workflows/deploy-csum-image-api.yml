name: Deploy CSUM Image API

on:
  push:
    branches: [csum-nn-site]
    paths:
      - "workers/csum-image-api/**"
      - ".github/workflows/deploy-csum-image-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/csum-image-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csum-nn-site

      - name: Validate production secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CSUM_ADMIN_TOKEN: ${{ secrets.CSUM_ADMIN_TOKEN }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -n "$OPENROUTER_API_KEY" ] || missing+=("OPENROUTER_API_KEY")
          [ -n "$CSUM_ADMIN_TOKEN" ] || missing+=("CSUM_ADMIN_TOKEN")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Ensure R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler r2 bucket create csum-nn-images || true

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Set OpenRouter secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: printf '%s' "$OPENROUTER_API_KEY" | wrangler secret put OPENROUTER_API_KEY

      - name: Set admin token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CSUM_ADMIN_TOKEN: ${{ secrets.CSUM_ADMIN_TOKEN }}
        run: printf '%s' "$CSUM_ADMIN_TOKEN" | wrangler secret put ADMIN_TOKEN

      - name: Verify production backend end-to-end
        shell: bash
        env:
          WORKER_URL: https://csum-nn-image-studio.kontrakevich.workers.dev
          CSUM_ADMIN_TOKEN: ${{ secrets.CSUM_ADMIN_TOKEN }}
        run: |
          health="$(curl -fsS "$WORKER_URL/health")"
          printf '%s' "$health" | jq -e '.ok == true and .r2 == true and .openrouter == true' >/dev/null

          models="$(curl -fsS "$WORKER_URL/api/models")"
          printf '%s' "$models" | jq -e '.data | type == "array" and length > 0' >/dev/null

          test_id="e2e-smoke"
          generated="$(curl -fsS -X POST "$WORKER_URL/api/reference-generate" \
            -H "Content-Type: application/json" \
            -H "X-CSUM-Admin-Token: $CSUM_ADMIN_TOKEN" \
            --data '{"id":"e2e-smoke","kind":"hero","title":"ЦУМ Нижний Новгород","project_reference_url":"https://mkontrakevich.github.io/GPT/assets/brand/csum-logo-official.png","prompt":"Grounding verification only. Preserve supplied reference identity. Minimal neutral editorial composition.","aspect_ratio":"1:1","output_format":"webp"}')"
          printf '%s' "$generated" | jq -e '.reference_grounded == true and .generated_derivative == true and .reference_count > 0 and ([.reference_sources[].type] | index("project_source") != null)' >/dev/null
          printf '%s' "$generated" | jq -c '{usage,reference_count,reference_sources}'
          candidate_key="$(printf '%s' "$generated" | jq -r '.candidate_key // empty')"
          [ -n "$candidate_key" ] || { echo "::error::Generation returned no persisted candidate"; printf '%s\n' "$generated"; exit 1; }

          applied="$(curl -fsS -X POST "$WORKER_URL/api/apply" \
            -H "Content-Type: application/json" \
            -H "X-CSUM-Admin-Token: $CSUM_ADMIN_TOKEN" \
            --data "$(jq -nc --arg id "$test_id" --arg key "$candidate_key" '{id:$id,candidate_key:$key,prompt:"E2E smoke test",model:"production"}')")"
          image_url="$(printf '%s' "$applied" | jq -r '.url // empty')"
          [ -n "$image_url" ] || { echo "::error::Apply returned no image URL"; exit 1; }
          curl -fsS -o /dev/null "$image_url"
          content="$(curl -fsS "$WORKER_URL/api/content")"
          printf '%s' "$content" | jq -e '.images["e2e-smoke"].url | type == "string" and length > 0' >/dev/null

          {
            echo "### CSUM Image API"
            echo ""
            echo "- Worker: $WORKER_URL"
            echo "- /health: OK"
            echo "- OpenRouter image models: OK"
            echo "- Reference-grounded generate: OK"
            echo "- Project-source grounding: OK"
            echo "- R2 candidate: OK"
            echo "- Apply manifest: OK"
            echo "- Generated asset GET: OK"
          } >> "$GITHUB_STEP_SUMMARY"
