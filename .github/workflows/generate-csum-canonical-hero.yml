name: Generate CSUM Canonical HERO

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  canonical_hero:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'CSUM_GENERATE_CANONICAL_HERO_V1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csum-nn-site
          fetch-depth: 0

      - name: Download verified historic facade source
        run: |
          SOURCE_URL="https://upload.wikimedia.org/wikipedia/commons/d/d7/%D0%A6%D0%A3%D0%9C_%28%D1%81%D1%82%D0%B0%D1%80%D1%8B%D0%B9_%D0%BA%D0%BE%D1%80%D0%BF%D1%83%D1%81%29.jpg"
          curl -L --fail --retry 3 -A "CSUM-NN-Editorial/3.0 (https://mkontrakevich.github.io/GPT/)" "$SOURCE_URL" -o /tmp/csum-source.jpg

      - name: Generate canonical source-locked HERO
        env:
          CSUM_ADMIN_TOKEN: ${{ secrets.CSUM_ADMIN_TOKEN }}
          IMAGE_URL: https://csum-nn-image-studio.kontrakevich.workers.dev
        run: |
          python3 - <<'PY'
          import base64,json
          with open("/tmp/csum-source.jpg","rb") as fh:
              ref="data:image/jpeg;base64,"+base64.b64encode(fh.read()).decode("ascii")
          prompt=open("content/hero-master-prompt.txt",encoding="utf-8").read().strip()
          payload={
            "id":"hero-csum",
            "entity":"Исторический фасад ЦУМа Нижний Новгород, ул. Героя Фильченкова, 10",
            "prompt":prompt,
            "aspect_ratio":"16:9",
            "reference_data_url":ref,
            "verified_facts":[
              "Historic old CSUM facade at 10 Geroya Filchenkova Street / Revolution Square, Nizhny Novgorod",
              "Frontal near-orthographic architectural portrait",
              "Exact historic facade geometry must remain recognizable",
              "Obstructive poles, wires and engineering clutter crossing the facade should be naturally removed or minimized",
              "No live weather grounding for the canonical master",
              "Neutral-to-warm high-editorial daylight establishes the master grade for the site"
            ]
          }
          json.dump(payload,open("/tmp/package.json","w",encoding="utf-8"),ensure_ascii=False)
          PY

          generated="$(curl --max-time 300 -sS -X POST "$IMAGE_URL/api/generate"             -H "Content-Type: application/json"             -H "X-CSUM-Admin-Token: $CSUM_ADMIN_TOKEN"             --data-binary @/tmp/package.json)"

          printf '%s' "$generated" | jq -c '{ok,error,id,persistent_candidate,candidate_key,url,usage}'
          printf '%s' "$generated" | jq -e '.ok == true and .persistent_candidate == true and (.candidate_key|length) > 0' >/dev/null

          candidate="$(printf '%s' "$generated" | jq -r '.url')"
          cost="$(printf '%s' "$generated" | jq -r '.usage.cost // "unavailable"')"
          candidate_key="$(printf '%s' "$generated" | jq -r '.candidate_key')"

          python3 - "$candidate" "$cost" "$candidate_key" <<'PY'
          import json,re,sys,datetime
          candidate,cost,candidate_key=sys.argv[1:4]
          p="index.html"
          s=open(p,encoding="utf-8").read()
          m=re.search(r'<img[^>]+data-ai-key="hero-csum"[^>]*>',s)
          if not m: raise SystemExit("hero-csum img not found")
          tag=m.group(0)
          if 'data-ai-src=' in tag:
              tag=re.sub(r'data-ai-src="[^"]*"',f'data-ai-src="{candidate}"',tag,count=1)
          tag=re.sub(r'(?<!data-ai-)src="[^"]*"',f'src="{candidate}"',tag,count=1)
          open(p,"w",encoding="utf-8").write(s[:m.start()]+tag+s[m.end():])

          result={
            "url":candidate,
            "candidate_key":candidate_key,
            "cost_usd":cost,
            "generated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "method":"image-to-image",
            "canonical_master":True,
            "historic_facade_lock":True,
            "frontal_orthographic_lock":True,
            "cityscape_lock":True,
            "weather_aware":False,
            "status":"candidate_published_to_site_for_review"
          }
          json.dump(result,open("csum-hero-result.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          PY

          git config user.name "csum-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html csum-hero-result.json
          git commit -m "CSUM: publish canonical frontal historic HERO"
          git push origin HEAD:csum-nn-site

          echo "CANONICAL_HERO=$candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "COST_USD=$cost" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - name: Upload fresh Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
