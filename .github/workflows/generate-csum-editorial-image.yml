name: Generate CSUM Editorial Image
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      article_index:
        description: Article index from production editorial feed
        required: false
        default: "0"
permissions:
  contents: write
jobs:
  generate:
    if: github.event.issue.title == 'CSUM_GENERATE_HERO_V2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csum-nn-site
          fetch-depth: 0
      - name: Generate candidate for visual QA
        env:
          CSUM_ADMIN_TOKEN: ${{ secrets.CSUM_ADMIN_TOKEN }}
          ARTICLE_INDEX: ${{ inputs.article_index }}
          EDITORIAL_URL: https://csum-nn-source-collector.kontrakevich.workers.dev
          IMAGE_URL: https://csum-nn-image-studio.kontrakevich.workers.dev
        run: |
          package="$(jq -nc '{
            id:"hero-csum",
            entity:"ЦУМ Нижний Новгород, ул. Героя Фильченкова, 10",
            prompt:"Transform the supplied real photograph into a high-end architectural editorial photograph. Preserve the exact existing CSUM building geometry, facade proportions, window rhythm, columns, entrances, roofline, camera viewpoint and every recognizable element of the visible city environment. CITYSCAPE LOCK: do not invent, remove, relocate or redesign any building, skyline feature, street geometry or landmark. Keep the source photograph as the factual spatial truth. Change only photographic qualities: refined natural directional light, restrained cinematic color, believable urban activity, subtle motion, tactile materials, 35mm editorial photography, no CGI gloss, no HDR, no fantasy architecture, no generated logos, no generated signage or typography.",
            aspect_ratio:"16:9",
            source_references:["https://upload.wikimedia.org/wikipedia/commons/d/d7/%D0%A6%D0%A3%D0%9C_%28%D1%81%D1%82%D0%B0%D1%80%D1%8B%D0%B9_%D0%BA%D0%BE%D1%80%D0%BF%D1%83%D1%81%29.jpg"],
            verified_facts:["Existing CSUM building at 10 Geroya Filchenkova Street, Nizhny Novgorod","Camera/source geometry and visible cityscape must remain unchanged"]
          }')"
          generated="$(curl --max-time 300 -sS -X POST "$IMAGE_URL/api/reference-generate" -H "Content-Type: application/json" -H "X-CSUM-Admin-Token: $CSUM_ADMIN_TOKEN" --data "$package")"
          printf '%s' "$generated" | jq -e '.ok == true and .generated_derivative == true and (.candidate_key|length) > 0' >/dev/null
          printf '%s' "$generated" | jq -c '{id,entity,usage,reference_count,reference_sources,generated_derivative,candidate_key,url}'
          echo "QA_STATUS=PENDING" >> "$GITHUB_STEP_SUMMARY"
          echo "CANDIDATE=$(printf '%s' "$generated" | jq -r '.url')" >> "$GITHUB_STEP_SUMMARY"
          echo "COST_USD=$(printf '%s' "$generated" | jq -r '.usage.cost // 0')" >> "$GITHUB_STEP_SUMMARY"
          candidate="$(printf '%s' "$generated" | jq -r '.url')"
          cost="$(printf '%s' "$generated" | jq -r '.usage.cost // "unavailable"')"
          jq -nc --arg url "$candidate" --arg cost "$cost" --arg at "$(date -u +%FT%TZ)" '{url:$url,cost_usd:$cost,generated_at:$at,method:"image-to-image",cityscape_lock:true}' > csum-hero-result.json
          python3 - "$candidate" <<'PY'
          import re,sys
          p="index.html"; s=open(p,encoding="utf-8").read(); u=sys.argv[1]
          m=re.search(r'<img[^>]+data-ai-key="hero-csum"[^>]*>',s)
          if not m: raise SystemExit("hero-csum img not found")
          tag=re.sub(r'src="[^"]*"', 'src="'+u+'"', m.group(0), count=1)
          open(p,"w",encoding="utf-8").write(s[:m.start()]+tag+s[m.end():])
          PY
          git config user.name "csum-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html csum-hero-result.json
          git commit -m "CSUM: publish source-locked AI editorial hero"
          git push origin HEAD:csum-nn-site
