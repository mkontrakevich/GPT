name: Generate CSUM Editorial Image
on:
  schedule:
    - cron: "17 * * * *"
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      article_index:
        description: Article index from production editorial feed
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name != 'issues' || github.event.issue.title == 'CSUM_GENERATE_HERO_V2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csum-nn-site
          fetch-depth: 0

      - name: Resolve weather state
        id: weather
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p content
          WEATHER_URL="https://api.open-meteo.com/v1/forecast?latitude=56.3202&longitude=43.9463&current=temperature_2m,precipitation,rain,snowfall,cloud_cover,weather_code,is_day&hourly=weather_code,precipitation_probability,cloud_cover&forecast_hours=6&timezone=Europe%2FMoscow"
          curl --fail --retry 3 -sS "$WEATHER_URL" -o /tmp/weather.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          w=json.load(open("/tmp/weather.json",encoding="utf-8"))
          cur=w.get("current",{})
          codes=w.get("hourly",{}).get("weather_code",[])[:6]
          probs=w.get("hourly",{}).get("precipitation_probability",[])[:6]
          clouds=w.get("hourly",{}).get("cloud_cover",[])[:6]

          def kind(code):
              code=int(code or 0)
              if code==0: return "clear"
              if code in (1,2): return "partly_cloudy"
              if code==3: return "overcast"
              if code in (45,48): return "fog"
              if code in (71,73,75,77,85,86): return "snow"
              if code in (95,96,99): return "storm"
              if code in (51,53,55,56,57,61,63,65,66,67,80,81,82): return "rain"
              return "overcast"

          current_kind=kind(cur.get("weather_code",0))
          target=current_kind
          if current_kind not in ("rain","snow","storm","fog"):
              for code,prob in zip(codes[:4],probs[:4]):
                  fk=kind(code)
                  if fk in ("rain","snow","storm") and (prob or 0)>=50:
                      target="approaching_"+fk
                      break

          daylight="day" if int(cur.get("is_day",1) or 0)==1 else "night"
          state=f"{target}_{daylight}"
          description={
              "clear":"clear sky and crisp natural light",
              "partly_cloudy":"broken cloud with alternating soft sun and shade",
              "overcast":"soft overcast daylight with restrained contrast",
              "fog":"credible urban fog or low mist, without hiding building identity",
              "rain":"realistic wet weather, damp pavement and subdued sky",
              "snow":"realistic seasonal snowfall or fresh snow appropriate to current conditions",
              "storm":"dark storm clouds and believable wet-weather atmosphere",
              "approaching_rain":"rain approaching soon: gathering cloud, cooler light, possible dampness, but no invented heavy rain",
              "approaching_snow":"snow approaching soon: cold dense sky and wintry light, but no invented heavy snowfall",
              "approaching_storm":"storm approaching soon: building cloud and changing light, without exaggerated disaster imagery"
          }.get(target,"natural current weather")

          meta={
              "state":state,
              "weather_kind":target,
              "daylight":daylight,
              "observed_at":cur.get("time"),
              "temperature_c":cur.get("temperature_2m"),
              "cloud_cover_pct":cur.get("cloud_cover"),
              "precipitation_mm":cur.get("precipitation"),
              "snowfall_cm":cur.get("snowfall"),
              "weather_code":cur.get("weather_code"),
              "forecast_codes":codes,
              "forecast_precipitation_probability":probs,
              "forecast_cloud_cover":clouds,
              "description":description,
              "source":"Open-Meteo",
              "coordinates":[56.3202,43.9463]
          }
          json.dump(meta,open("/tmp/weather-state.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)

          previous={}
          p=Path("content/hero-weather-state.json")
          if p.exists():
              try: previous=json.load(open(p,encoding="utf-8"))
              except Exception: previous={}
          force=os.environ.get("EVENT_NAME")!="schedule"
          changed=force or previous.get("state")!=state
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"changed={'true' if changed else 'false'}\n")
              out.write(f"state={state}\n")
          print(json.dumps({"previous":previous.get("state"),"current":state,"force":force,"changed":changed},ensure_ascii=False))
          PY

      - name: Generate weather-aware source-locked HERO
        if: steps.weather.outputs.changed == 'true'
        env:
          CSUM_ADMIN_TOKEN: ${{ secrets.CSUM_ADMIN_TOKEN }}
          IMAGE_URL: https://csum-nn-image-studio.kontrakevich.workers.dev
        run: |
          SOURCE_URL="https://upload.wikimedia.org/wikipedia/commons/d/d7/%D0%A6%D0%A3%D0%9C_%28%D1%81%D1%82%D0%B0%D1%80%D1%8B%D0%B9_%D0%BA%D0%BE%D1%80%D0%BF%D1%83%D1%81%29.jpg"
          curl -L --fail --retry 3 -A "CSUM-NN-Editorial/1.0 (https://mkontrakevich.github.io/GPT/)" "$SOURCE_URL" -o /tmp/csum-source.jpg

          python3 - <<'PY'
          import base64,json
          weather=json.load(open("/tmp/weather-state.json",encoding="utf-8"))
          with open("/tmp/csum-source.jpg","rb") as fh:
              ref="data:image/jpeg;base64,"+base64.b64encode(fh.read()).decode("ascii")
          master=open("content/hero-master-prompt.txt",encoding="utf-8").read().strip()
          weather_context=(
              f"\n\nCURRENT WEATHER CONTEXT:\n"
              f"Weather state: {weather['state']}. Observed local time: {weather['observed_at']}; "
              f"temperature {weather['temperature_c']} C; cloud cover {weather['cloud_cover_pct']}%; "
              f"precipitation {weather['precipitation_mm']} mm; snowfall {weather['snowfall_cm']} cm. "
              f"Near-term forecast weather codes: {weather['forecast_codes']}; "
              f"precipitation probabilities: {weather['forecast_precipitation_probability']}%. "
              f"Photographic weather direction: {weather['description']}."
          )
          prompt=master+weather_context
          payload={
            "id":"hero-csum",
            "entity":"ЦУМ Нижний Новгород, ул. Героя Фильченкова, 10",
            "prompt":prompt,
            "aspect_ratio":"16:9",
            "reference_data_url":ref,
            "verified_facts":[
              "Existing CSUM building at 10 Geroya Filchenkova Street, Nizhny Novgorod",
              "Camera/source geometry and visible cityscape must remain unchanged",
              "Weather appearance must remain consistent with the supplied Open-Meteo current conditions and near-term forecast",
              "Obstructive engineering clutter crossing the facade must be removed or minimized naturally",
              "The facade must remain the clear visual protagonist without changing its verified architecture"
            ]
          }
          json.dump(payload,open("/tmp/package.json","w",encoding="utf-8"),ensure_ascii=False)
          PY

          generated="$(curl --max-time 300 -sS -X POST "$IMAGE_URL/api/generate" -H "Content-Type: application/json" -H "X-CSUM-Admin-Token: $CSUM_ADMIN_TOKEN" --data-binary @/tmp/package.json)"
          printf '%s' "$generated" | jq -c '{ok,error,id,persistent_candidate,candidate_key,url}'
          printf '%s' "$generated" | jq -e '.ok == true and .persistent_candidate == true and (.candidate_key|length) > 0' >/dev/null
          candidate="$(printf '%s' "$generated" | jq -r '.url')"
          cost="$(printf '%s' "$generated" | jq -r '.usage.cost // "unavailable"')"

          python3 - "$candidate" "$cost" <<'PY'
          import json,re,sys,datetime
          candidate,cost=sys.argv[1],sys.argv[2]
          weather=json.load(open("/tmp/weather-state.json",encoding="utf-8"))

          p="index.html"
          s=open(p,encoding="utf-8").read()
          m=re.search(r'<img[^>]+data-ai-key="hero-csum"[^>]*>',s)
          if not m: raise SystemExit("hero-csum img not found")
          tag=m.group(0)
          tag=re.sub(r'data-ai-src="[^"]*"', f'data-ai-src="{candidate}"', tag, count=1)
          tag=re.sub(r'(?<!data-ai-)src="[^"]*"', f'src="{candidate}"', tag, count=1)
          open(p,"w",encoding="utf-8").write(s[:m.start()]+tag+s[m.end():])

          result={
            "url":candidate,
            "cost_usd":cost,
            "generated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "method":"image-to-image",
            "cityscape_lock":True,
            "weather_aware":True,
            "weather_state":weather
          }
          json.dump(result,open("csum-hero-result.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          json.dump(weather,open("content/hero-weather-state.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          PY

          echo "WEATHER_STATE=${{ steps.weather.outputs.state }}" >> "$GITHUB_STEP_SUMMARY"
          echo "CANDIDATE=$candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "COST_USD=$cost" >> "$GITHUB_STEP_SUMMARY"

          git config user.name "csum-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html csum-hero-result.json content/hero-weather-state.json
          git commit -m "CSUM: update weather-aware source-locked HERO"
          git push origin HEAD:csum-nn-site

      - name: Weather unchanged
        if: steps.weather.outputs.changed != 'true'
        run: echo "Weather state unchanged; no paid image generation required."


  regenerate_all:
    if: github.event_name == 'issues' && github.event.issue.title == 'CSUM_REGENERATE_ALL_VISUALS_V1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csum-nn-site
          fetch-depth: 0

      - name: Regenerate and publish every visual slot
        env:
          CSUM_ADMIN_TOKEN: ${{ secrets.CSUM_ADMIN_TOKEN }}
          IMAGE_URL: https://csum-nn-image-studio.kontrakevich.workers.dev
        run: |
          python3 - <<'PY'
          import base64, json, os, re, sys, time, mimetypes, urllib.request, urllib.error, urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone

          api=os.environ["IMAGE_URL"].rstrip("/")
          token=os.environ["CSUM_ADMIN_TOKEN"]
          catalog=json.load(open("content/visuals.json",encoding="utf-8"))
          global_master=open("content/visual-master-prompt.txt",encoding="utf-8").read().strip()
          hero_master=open("content/hero-master-prompt.txt",encoding="utf-8").read().strip()

          def request_json(url, payload=None, headers=None, timeout=360):
              h={"User-Agent":"CSUM-NN-Editorial/2.0 (https://mkontrakevich.github.io/GPT/)"}
              if headers: h.update(headers)
              data=None
              if payload is not None:
                  data=json.dumps(payload,ensure_ascii=False).encode("utf-8")
                  h["Content-Type"]="application/json"
              req=urllib.request.Request(url,data=data,headers=h,method="POST" if payload is not None else "GET")
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8"))

          def download_reference(url):
              req=urllib.request.Request(url,headers={"User-Agent":"CSUM-NN-Editorial/2.0 (https://mkontrakevich.github.io/GPT/)","Accept":"image/avif,image/webp,image/apng,image/*,*/*;q=0.8"})
              with urllib.request.urlopen(req,timeout=90) as r:
                  data=r.read()
                  ct=(r.headers.get_content_type() or "").lower()
              if not ct.startswith("image/"):
                  ext=Path(urllib.parse.urlparse(url).path).suffix.lower()
                  ct=mimetypes.types_map.get(ext,"image/jpeg")
              return "data:"+ct+";base64,"+base64.b64encode(data).decode("ascii"), len(data), ct

          def weather_context():
              try:
                  u=("https://api.open-meteo.com/v1/forecast?latitude=56.3202&longitude=43.9463"
                     "&current=temperature_2m,precipitation,rain,snowfall,cloud_cover,weather_code,is_day"
                     "&hourly=weather_code,precipitation_probability,cloud_cover&forecast_hours=6&timezone=Europe%2FMoscow")
                  w=request_json(u)
                  cur=w.get("current",{})
                  return (
                    "\n\nCURRENT WEATHER CONTEXT: "
                    f"Observed local time {cur.get('time')}; temperature {cur.get('temperature_2m')} C; "
                    f"cloud cover {cur.get('cloud_cover')}%; precipitation {cur.get('precipitation')} mm; "
                    f"snowfall {cur.get('snowfall')} cm; weather code {cur.get('weather_code')}; "
                    f"is_day {cur.get('is_day')}; near-term codes {w.get('hourly',{}).get('weather_code',[])[:6]}; "
                    f"precipitation probabilities {w.get('hourly',{}).get('precipitation_probability',[])[:6]}%."
                  )
              except Exception as e:
                  return "\n\nCURRENT WEATHER CONTEXT unavailable; keep weather neutral and physically plausible."

          results=[]
          failures=[]
          total_cost=0.0
          hero_url=None
          for idx,item in enumerate(catalog.get("items",[]),1):
              item_id=item["id"]
              refs=item.get("sourceReferences") or []
              if not refs:
                  failures.append({"id":item_id,"error":"NO_SOURCE_REFERENCE"})
                  continue
              src=refs[0]
              print(f"[{idx}/{len(catalog['items'])}] {item_id}: downloading verified source")
              try:
                  ref_data, source_bytes, media=download_reference(src)
                  prompt=global_master+"\n\nSUBJECT: "+item.get("title","")+"\nEDITORIAL BRIEF: "+item.get("brief","")
                  if item_id=="hero-csum":
                      prompt += "\n\nHERO-SPECIFIC CANON:\n"+hero_master+weather_context()
                  payload={
                    "id":item_id,
                    "prompt":prompt,
                    "aspect_ratio":item.get("aspectRatio","16:9"),
                    "output_format":"webp",
                    "reference_data_url":ref_data
                  }
                  gen=request_json(api+"/api/generate",payload,{"X-CSUM-Admin-Token":token})
                  if not gen.get("ok") or not gen.get("candidate_key"):
                      raise RuntimeError(gen.get("error") or "GENERATION_FAILED")
                  ck=gen["candidate_key"]
                  request_json(api+"/api/approve",{"candidate_key":ck,"reasons":["User authorized site-wide visual replacement; source-first batch QA policy."]},{"X-CSUM-Admin-Token":token})
                  applied=request_json(api+"/api/apply",{"id":item_id,"candidate_key":ck,"prompt":prompt,"model":gen.get("model","")},{"X-CSUM-Admin-Token":token})
                  cost=(gen.get("usage") or {}).get("cost")
                  if isinstance(cost,(int,float)): total_cost+=float(cost)
                  record={
                    "id":item_id,
                    "source_url":src,
                    "source_bytes":source_bytes,
                    "source_media_type":media,
                    "candidate_key":ck,
                    "url":applied.get("url") or gen.get("url"),
                    "model":gen.get("model"),
                    "cost_usd":cost,
                    "source_locked":True,
                    "generation_method":"image-to-image",
                    "published":True
                  }
                  results.append(record)
                  if item_id=="hero-csum": hero_url=record["url"]
                  print(json.dumps({"id":item_id,"published":True,"cost_usd":cost,"url":record["url"]},ensure_ascii=False))
              except Exception as e:
                  failures.append({"id":item_id,"source_url":src,"error":str(e)})
                  print(json.dumps({"id":item_id,"published":False,"error":str(e)},ensure_ascii=False))
              time.sleep(1)

          if hero_url:
              p=Path("index.html")
              s=p.read_text(encoding="utf-8")
              def replace_tag(m):
                  tag=m.group(0)
                  if 'data-ai-key="hero-csum"' in tag or re.search(r'data-ai-src="[^"]*hero-csum[^"]*"',tag):
                      if 'data-ai-src=' in tag:
                          tag=re.sub(r'data-ai-src="[^"]*"',f'data-ai-src="{hero_url}"',tag,count=1)
                      tag=re.sub(r'(?<!data-ai-)src="[^"]*"',f'src="{hero_url}"',tag,count=1)
                  return tag
              s=re.sub(r'<img\b[^>]*>',replace_tag,s)
              p.write_text(s,encoding="utf-8")

          report={
            "generated_at":datetime.now(timezone.utc).isoformat(),
            "requested_count":len(catalog.get("items",[])),
            "published_count":len(results),
            "failure_count":len(failures),
            "total_cost_usd":round(total_cost,8),
            "results":results,
            "failures":failures
          }
          Path("content/site-visual-batch-result.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/site-visual-fail-count").write_text(str(len(failures)),encoding="utf-8")
          print(json.dumps({"published":len(results),"failed":len(failures),"total_cost_usd":round(total_cost,8)},ensure_ascii=False))
          PY

          git config user.name "csum-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html content/site-visual-batch-result.json
          git commit -m "CSUM: regenerate all site visuals with source-first canon" || true
          git push origin HEAD:csum-nn-site

          fail_count="$(cat /tmp/site-visual-fail-count)"
          if [ "$fail_count" != "0" ]; then
            echo "::error::$fail_count visual slots failed generation or publication"
            exit 1
          fi
