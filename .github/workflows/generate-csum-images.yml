name: Legacy batch CSUM image generator

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "Regenerate every editorial image even if article text is unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: csum-openrouter-images
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CSUM branch
        uses: actions/checkout@v4
        with:
          ref: csum-nn-site
          fetch-depth: 0

      - name: Compile generator
        run: python3 -m py_compile tools/generate_csum_images.py

      - name: Validate site and generator source
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          python -m py_compile tools/generate_csum_images.py
          test -s assets/brand/csum-logo.svg
          grep -q 'assets/brand/csum-logo.svg' index.html
          grep -q 'motion-ribbon' index.html
          grep -q 'CSUM ANIMATED LANDING' styles.css
          echo "Source validation passed"

      - name: Check OpenRouter configuration
        id: preflight
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENROUTER_API_KEY is not configured yet. Generator is installed and waiting for the repository secret."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image runtime
        if: steps.preflight.outputs.enabled == 'true'
        run: python -m pip install --quiet pillow

      - name: Generate editorial images through OpenRouter
        if: steps.preflight.outputs.enabled == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ vars.OPENROUTER_IMAGE_MODEL || 'openai/gpt-image-2' }}
          FORCE_REGENERATE: ${{ inputs.force_regenerate && '1' || '0' }}
        run: python tools/generate_csum_images.py

      - name: Validate generated image package
        if: steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/generated/hero-csum.webp
          test -f assets/generated/manifest.json
          test "$(find assets/generated -maxdepth 1 -name '*.webp' | wc -l)" -ge 10
          if grep -RIE '<img[^>]+src=["'"'"'](https?:|../https?:)' index.html magazine.html articles/*.html; then
            echo "Remote editorial image source detected"
            exit 1
          fi

      - name: Commit generated assets and rewired pages
        if: steps.preflight.outputs.enabled == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets/generated index.html magazine.html articles)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No image changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated index.html magazine.html articles
          git commit -m "Generate CSUM editorial imagery via OpenRouter"
          git push origin HEAD:csum-nn-site
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish refreshed CSUM site
        if: steps.preflight.outputs.enabled == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run csum-pages.yml --ref main
