name: Health Game Console - Deploy Synthetic Preview
on:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preview and privacy restrictions
        run: node --test health-game-console/tests/preview.test.mjs
      - name: Validate Worker syntax
        run: node --check health-game-console/worker.mjs
  deploy:
    if: github.ref == 'refs/heads/feat/health-game-console-mvp'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse deployment without authorized secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
      - name: Package versioned preview as local Worker asset
        shell: bash
        run: |
          mkdir -p health-game-console/dist
          cp health-game-console/preview.html health-game-console/dist/index.html
      - name: Deploy static assets from GitHub commit
        run: npx --yes wrangler@4 deploy --config health-game-console/wrangler.jsonc
