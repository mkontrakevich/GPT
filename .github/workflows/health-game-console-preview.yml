name: HGC Preview Quality Gate
on:
  push:
    branches: ["feat/health-game-console-mvp"]
    paths:
      - "health-game-console/**"
      - ".github/workflows/health-game-console-preview.yml"
  pull_request:
    paths:
      - "health-game-console/**"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preview security and structure tests
        run: node --test health-game-console/tests/*.test.mjs
