name: Human OS Cinematic Visual QA
on:
  pull_request:
    paths:
      - "human-os-webgl/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cinematic scene syntax, privacy and interaction checks
        run: node --test human-os-webgl/tests/cinematic.test.mjs
      - name: Run original World validation
        run: node human-os-webgl/validate.mjs
      - name: Build deployable Worker
        run: node human-os-webgl/tools/build-worker.mjs
      - name: Install isolated browser QA
        run: npm install --prefix human-os-webgl/qa --ignore-scripts --no-audit --no-fund
      - name: Install browser engines
        run: cd human-os-webgl/qa && npx playwright install --with-deps chromium firefox webkit
      - name: Real browser runtime matrix (software GPU, not physical devices)
        run: node human-os-webgl/qa/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-os-browser-evidence
          path: human-os-webgl/qa/artifacts
