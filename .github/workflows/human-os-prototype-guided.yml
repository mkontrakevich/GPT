name: HUMAN OS - Guided Character Studio QA
on:
  push:
    branches: ["feat/human-os-prototype-guided-v3"]
    paths:
      - "human-os-prototype-studio/**"
      - ".github/workflows/human-os-prototype-guided.yml"
  pull_request:
    paths:
      - "human-os-prototype-studio/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guided UX and all prior prototype tests
        run: node --test human-os-prototype-studio/tests/*.test.mjs
