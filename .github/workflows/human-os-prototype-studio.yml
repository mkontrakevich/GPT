name: HUMAN OS Reference Prototype Studio QA
on:
  push:
    branches: ["feat/human-os-reference-blockout-studio"]
    paths:
      - "human-os-prototype-studio/**"
      - ".github/workflows/human-os-prototype-studio.yml"
  pull_request:
    paths:
      - "human-os-prototype-studio/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate editor, 3D rig, export and privacy
        run: node --test human-os-prototype-studio/tests/*.test.mjs
