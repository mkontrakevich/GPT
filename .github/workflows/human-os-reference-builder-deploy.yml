name: HUMAN OS Reference Builder — Deploy (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser scripts
        run: node --test human-os-character/builder/tests/*.test.mjs
      - name: Validate Worker syntax
        run: node --check human-os-character/builder/worker.mjs
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/human-os-reference-to-3d-builder'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dedicated Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Package standalone assets
        run: |
          mkdir -p human-os-character/builder/dist
          cp human-os-character/builder/index.html human-os-character/builder/dist/index.html
          cp human-os-character/builder/builder.js human-os-character/builder/dist/builder.js
      - name: Deploy with Wrangler from GitHub source
        run: npx --yes wrangler@4 deploy --config human-os-character/builder/wrangler.jsonc
