name: HUMAN OS — Reference to 3D QA
on:
  push:
    branches: ['feat/human-os-reference-to-3d-builder']
    paths:
      - 'human-os-character/builder/**'
      - '.github/workflows/human-os-reference-builder.yml'
  pull_request:
    paths:
      - 'human-os-character/builder/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser editor, privacy and contract
        run: node --test human-os-character/builder/tests/*.test.mjs
