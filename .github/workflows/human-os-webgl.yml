name: Human OS WebGL - Cloudflare Deploy
on:
  push:
    branches: ["feat/human-os-webgl-mobile"]
    paths:
      - "human-os-webgl/**"
      - ".github/workflows/human-os-webgl.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Check content and WebGL dependency
        run: |
          test -s human-os-webgl/index.html
          grep -q 'WebGLRenderer' human-os-webgl/index.html
          grep -q 'touchmove' human-os-webgl/index.html
          grep -q 'human-os-living-world' human-os-webgl/README.md
  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require deployment authorization
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing deployment token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing account ID"; exit 1; }
      - name: Assemble immutable HTML static asset
        run: |
          mkdir -p human-os-webgl/dist
          cp human-os-webgl/index.html human-os-webgl/dist/index.html
      - name: Deploy GitHub source with Wrangler
        run: npx --yes wrangler@4 deploy --config human-os-webgl/wrangler.jsonc
