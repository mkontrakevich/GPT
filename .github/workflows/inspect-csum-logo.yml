name: Inspect official CSUM logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-csum-logo.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch csum.ru homepage
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error https://www.csum.ru/ -o /tmp/csum.html
          echo "=== logo/svg candidates from HTML ==="
          grep -Eoi '([A-Za-z0-9_./-]+\.(svg|png|webp|jpg|jpeg))' /tmp/csum.html | grep -Ei 'logo|brand|header|csum|sum|svg' | sort -u || true
          echo "=== snippets containing logo/svg ==="
          grep -Ein 'logo|\.svg|brand' /tmp/csum.html | head -120 || true
          echo "=== stylesheet URLs ==="
          grep -Eo 'href="[^"]+\.css[^"]*"' /tmp/csum.html | sed -E 's/^href="//;s/"$//' | head -50
          python - <<'PY'
          from urllib.parse import urljoin
          import re, urllib.request
          html=open('/tmp/csum.html',encoding='utf-8',errors='ignore').read()
          css_urls=re.findall(r'href=["\']([^"\']+\.css[^"\']*)', html, re.I)
          for u in css_urls:
              url=urljoin('https://www.csum.ru/',u)
              try:
                  data=urllib.request.urlopen(url,timeout=20).read().decode('utf-8','ignore')
              except Exception as e:
                  print('CSS ERROR',url,e)
                  continue
              print('--- CSS',url)
              for m in sorted(set(re.findall(r'[^()\s"\']+\.(?:svg|png|webp)',data,re.I))):
                  if re.search(r'logo|brand|header|svg',m,re.I):
                      print(urljoin(url,m))
          PY
