name: CSUM Pages backup deploy

on:
  workflow_dispatch:
  push:
    branches: [csum-nn-site]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "config.js"
      - ".github/workflows/pages.yml"

concurrency:
  group: csum-pages-production
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # E2E validates the live Editorial API as well as the static Pages deployment.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csum-nn-site
      - uses: actions/configure-pages@v5
      - name: Upload fresh Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Public smoke
        run: |
          curl --retry 6 --retry-delay 3 -fsS https://mkontrakevich.github.io/GPT/ >/tmp/index.html
          grep -qi "ЦУМ" /tmp/index.html
          curl --retry 6 --retry-delay 3 -fsS https://mkontrakevich.github.io/GPT/dynamic-article.html >/tmp/article.html
          grep -qi "Журнал" /tmp/article.html
      - name: Desktop and mobile public E2E
        run: |
          npx -y playwright@1.55.0 install --with-deps chromium
          npx -y playwright@1.55.0 screenshot --device="Desktop Chrome" --wait-for-timeout=4000 https://mkontrakevich.github.io/GPT/ /tmp/csum-desktop.png
          npx -y playwright@1.55.0 screenshot --viewport-size="390,844" --user-agent="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36" --wait-for-timeout=4000 https://mkontrakevich.github.io/GPT/ /tmp/csum-mobile.png
          test -s /tmp/csum-desktop.png
          test -s /tmp/csum-mobile.png
          article_id="$(curl -fsS https://csum-nn-source-collector.kontrakevich.workers.dev/api/articles | jq -r '.articles[0].id // empty')"
          test -n "$article_id"
          article_url="https://mkontrakevich.github.io/GPT/dynamic-article.html?id=$article_id"
          npx -y playwright@1.55.0 screenshot --device="Desktop Chrome" --wait-for-timeout=4000 "$article_url" /tmp/csum-article-desktop.png
          npx -y playwright@1.55.0 screenshot --viewport-size="390,844" --user-agent="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36" --wait-for-timeout=4000 "$article_url" /tmp/csum-article-mobile.png
          test -s /tmp/csum-article-desktop.png
          test -s /tmp/csum-article-mobile.png
