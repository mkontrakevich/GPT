name: Probe official CSUM logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-csum-logo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official csum.ru logo assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, urllib.parse, struct

          ROOT='https://www.csum.ru/'
          UA={'User-Agent':'Mozilla/5.0'}

          def get(path, binary=False):
              url=urllib.parse.urljoin(ROOT,path)
              raw=urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=30).read()
              return raw if binary else raw.decode('utf-8','replace')

          html=get('/')
          print('HTML_BYTES',len(html))
          for i,line in enumerate(html.splitlines(),1):
              if re.search(r'logo|\.svg|brand',line,re.I):
                  print(f'HTML_LINE {i}: {line[:2000]}')

          fav=get('/favicon.svg')
          print('OFFICIAL_FAVICON_SVG_BEGIN')
          print(fav[:12000])
          print('OFFICIAL_FAVICON_SVG_END')

          png=get('/images/logo.png', binary=True)
          print('OFFICIAL_LOGO_PNG_BYTES',len(png))
          if png[:8] == b'\x89PNG\r\n\x1a\n':
              w,h=struct.unpack('>II',png[16:24])
              print('OFFICIAL_LOGO_PNG_SIZE',w,h)

          print('OFFICIAL_LOGO_PNG_URL',urllib.parse.urljoin(ROOT,'/images/logo.png'))
          print('OFFICIAL_FAVICON_SVG_URL',urllib.parse.urljoin(ROOT,'/favicon.svg'))
          PY
