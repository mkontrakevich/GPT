name: Sync official CSUM brand asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-csum-brand.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CSUM branch
        uses: actions/checkout@v4
        with:
          ref: csum-nn-site
          fetch-depth: 0

      - name: Download official logo and create SVG asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/brand
          curl -fL --retry 3 -A "Mozilla/5.0"             "https://www.csum.ru/images/logo.png"             -o assets/brand/csum-logo-official.png

          python -m pip install --quiet vtracer || true

          python - <<'PY'
          from pathlib import Path
          import base64

          src=Path("assets/brand/csum-logo-official.png")
          out=Path("assets/brand/csum-logo.svg")
          converted=False

          try:
              import vtracer
              vtracer.convert_image_to_svg_py(
                  str(src), str(out),
                  colormode="color",
                  hierarchical="stacked",
                  mode="spline",
                  filter_speckle=2,
                  color_precision=8,
                  layer_difference=8,
                  corner_threshold=60,
                  length_threshold=3.5,
                  max_iterations=10,
                  splice_threshold=45,
                  path_precision=4,
              )
              converted=out.exists() and out.stat().st_size>500
          except Exception as e:
              print("Vector trace unavailable:", repr(e))

          if not converted:
              b64=base64.b64encode(src.read_bytes()).decode("ascii")
              # Exact official artwork fallback packaged as an SVG container.
              out.write_text(
                  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305 121" '
                  'width="305" height="121" role="img" aria-label="ЦУМ Нижний Новгород">'
                  '<image width="305" height="121" href="data:image/png;base64,'+b64+'"/>'
                  '</svg>',
                  encoding="utf-8"
              )
              print("Used exact-artwork SVG container fallback")

          print("SVG bytes:", out.stat().st_size)
          PY

      - name: Commit brand asset
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets/brand/csum-logo.svg assets/brand/csum-logo-official.png)" ]; then
            echo "Brand asset already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/csum-logo.svg assets/brand/csum-logo-official.png
          git commit -m "Sync official CSUM logo from csum.ru"
          git push origin HEAD:csum-nn-site
