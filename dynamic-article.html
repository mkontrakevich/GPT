<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Журнал — ЦУМ Нижний Новгород</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script></head><body><header class="header scrolled"><a class="brand" href="index.html"><img class="brand-logo" src="assets/brand/csum-logo.svg" alt="ЦУМ"></a><a href="index.html#today">← Журнал</a></header><main id="article" style="max-width:900px;margin:120px auto 80px;padding:0 20px"><p>Загружаем материал…</p></main><script>(()=>{const API=(window.CSUM_CONFIG&&window.CSUM_CONFIG.editorialApiBase)||'https://csum-nn-source-collector.kontrakevich.workers.dev',id=new URLSearchParams(location.search).get('id'),h=document.querySelector('#article'),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));fetch(API+'/api/articles').then(r=>r.json()).then(j=>{const a=Array.isArray(j)?j:(j.articles||j.items||[]),x=a.find(v=>String(v.id||v.slug||v.title)===id)||a[0];if(!x)throw Error('not found');document.title=(x.title||'Журнал')+' — ЦУМ';const paras=Array.isArray(x.sections)?x.sections.map(s=>'<section><h2>'+esc(s.title||'')+'</h2><p>'+esc(s.text||s.body||'')+'</p></section>').join(''):'<p>'+esc(x.body||x.text||x.summary||'')+'</p>';const safeUrl=u=>{try{const q=new URL(u);return ['http:','https:'].includes(q.protocol)?q.href:null}catch{return null}};const sources=(x.sources||x.source_urls||[]).map(s=>{const u=typeof s==='string'?s:s.url,t=typeof s==='string'?'Источник':(s.title||'Источник');try{const q=new URL(u);if(!['http:','https:'].includes(q.protocol))return'';return '<a href="'+esc(q.href)+'" target="_blank" rel="noopener noreferrer">'+esc(t)+'</a>'}catch{return''}}).filter(Boolean).join(' · ');h.innerHTML='<p class="eyebrow">ЦУМ · Журнал</p><h1>'+esc(x.title||'')+'</h1><p class="lead">'+esc(x.deck||'')+'</p>'+(safeUrl(x.image_url)?'<img src="'+esc(safeUrl(x.image_url))+'" alt="" style="width:100%;height:auto;margin:30px 0">':'')+paras+(sources?'<footer><h3>Источники и места</h3><p>'+sources+'</p></footer>':'')}}).catch(()=>h.innerHTML='<h1>Материал временно недоступен</h1><p><a href="index.html">Вернуться на главную</a></p>')})()</script></body></html>
