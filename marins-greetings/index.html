<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Приветствия · MARINS</title>
<style>
:root{--ink:#003050;--blue:#449cb7;--pale:#a5d4e8;--line:#c9dce3;--muted:#557283;--paper:#fff;--green:#17614f;--amber:#8a4b00}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-width:320px}main{width:min(1440px,100%);margin:auto;padding:0 28px 50px}.site-header{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:22px;border-bottom:1px solid var(--ink)}.wordmark{font-size:20px;font-weight:800;letter-spacing:.08em;text-decoration:none;color:var(--ink)}.site-state{font-size:12px;letter-spacing:.1em;color:var(--muted)}.hero{padding:42px 0 28px}.hero span{color:var(--blue);letter-spacing:.04em;font-size:14px}.hero h1{font-size:clamp(30px,5vw,55px);font-weight:900;letter-spacing:-.055em;margin:12px 0;line-height:1}.hero p{margin:0;line-height:1.55;color:#315366;max-width:800px;font-weight:300}.sync{margin:0 0 22px;padding:14px 16px;border-left:3px solid var(--blue);background:#f4f9fb;color:#315366;line-height:1.5}.sync.error{border-color:#b45442;background:#fff6f3}.greeting-summary{display:flex;align-items:center;margin:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);flex-wrap:wrap}.greeting-summary>div{min-width:170px;padding:15px 22px 16px;border-right:1px solid var(--line);display:grid;gap:3px}.greeting-summary>div:first-child{padding-left:0}.greeting-summary b{font-size:32px;line-height:1;font-weight:900}.greeting-summary span{font-size:12px;line-height:1.25;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.month-filter{margin-left:auto;display:grid;gap:4px;min-width:210px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:10px 0}.month-filter select{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff;border:1px solid var(--ink);padding:8px}.table-wrap{overflow:auto;border:1px solid var(--line);-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:980px}th,td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;line-height:1.45}th{background:var(--ink);color:#fff;font-weight:700;position:sticky;top:0}td{font-size:14px}.hotel{font-weight:700}.greeting{min-width:330px}.badge{display:inline-block;padding:5px 9px;border:1px solid var(--pale);border-radius:99px;white-space:nowrap;font-size:13px}.badge.in_progress,.badge.soon{color:#003f60;border-color:var(--blue);background:#f2f8fa}.badge.scheduled,.badge.active{color:var(--green);border-color:var(--green);background:#eff8f4}.badge.need_info{color:var(--amber);border-color:#d7aa52;background:#fff8e8}.badge.past{color:#677b85;border-color:var(--line)}.empty{padding:26px 18px;color:var(--muted);text-align:center}@media(max-width:760px){main{padding:0 16px 35px}.site-header{min-height:72px;padding:13px 0 8px}.wordmark{font-size:17px}.site-state{font-size:10px}.hero{padding:30px 0 20px}.hero h1{font-size:38px}.greeting-summary{align-items:stretch;margin:18px 0}.greeting-summary>div{min-width:0;flex:1;padding:12px 8px}.greeting-summary b{font-size:25px}.greeting-summary span{font-size:10px}.month-filter{min-width:100%;width:100%;margin-left:0;border-top:1px solid var(--line)}.month-filter select{width:100%}}
</style>
</head>
<body><main>
<header class="site-header"><a class="wordmark" href="./">MARINS HOTELS</a><span class="site-state" id="state">SNAPSHOT</span></header>
<section class="hero"><span>MARINS / ЗАЯВКИ НА ПРИВЕТСТВИЯ</span><h1>План размещения<br>на LED-экранах</h1><p>Мобильное представление данных из локального раздела <code>localhost:5681/greetings</code>.</p></section>
<p class="sync" id="sync">Загрузка актуального snapshot…</p>
<section class="greeting-summary"><div><b id="planned">0</b><span>запланировано</span></div><div><b id="working">0</b><span>в работе</span></div><div><b id="active">0</b><span>активно</span></div><label class="month-filter">Месяц размещения<select id="month"><option value="all">Все месяцы</option></select></label></section>
<section class="table-wrap"><table><thead><tr><th>Статус</th><th>Период</th><th>Отель</th><th>Текст приветствия</th><th>Срок: с</th><th>Срок: по</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Загрузка…</td></tr></tbody></table></section>
</main>
<script>
const SNAPSHOT='https://raw.githubusercontent.com/mkontrakevich/GPT/main/marins-greetings/snapshot.json';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoDate=v=>v?new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(',',''):'—';
const day=v=>v?new Date(v).toISOString().slice(0,10):'';
const month=v=>day(v).slice(0,7);
const today=()=>new Date().toISOString().slice(0,10);
function period(r){const s=day(r.starts_at),e=day(r.end_at||r.starts_at),t=today();if(e<t)return['прошло','past'];if(s<=t&&e>=t)return['активно','active'];const diff=Math.round((Date.parse(s+'T00:00:00Z')-Date.parse(t+'T00:00:00Z'))/86400000);return diff<=7?[`через ${diff} дн.`,'soon']:[`через ${diff} дн.`,'later'];}
function statusLabel(s){return {in_progress:'в работе',scheduled:'запланировано',active:'активно',need_info:'нужна информация'}[s]||s||'—';}
let all=[];
function render(){const selected=document.querySelector('#month').value,visible=selected==='all'?all:all.filter(r=>month(r.starts_at)===selected);document.querySelector('#planned').textContent=visible.filter(r=>r.placement_status==='scheduled'&&day(r.starts_at)>today()).length;document.querySelector('#working').textContent=visible.filter(r=>r.placement_status==='in_progress'&&day(r.starts_at)>today()).length;document.querySelector('#active').textContent=visible.filter(r=>day(r.starts_at)<=today()&&day(r.end_at||r.starts_at)>=today()).length;document.querySelector('#rows').innerHTML=visible.length?visible.map(r=>{const[p,pk]=period(r);return `<tr><td><span class="badge ${esc(r.placement_status)}">${esc(statusLabel(r.placement_status))}</span></td><td><span class="badge ${pk}">${esc(p)}</span></td><td class="hotel">${esc(r.hotel)}</td><td class="greeting">${esc(r.greeting_text)}</td><td>${esc(isoDate(r.starts_at))}</td><td>${esc(isoDate(r.end_at))}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Нет записей для выбранного периода.</td></tr>';}
async function load(){try{const res=await fetch(SNAPSHOT+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();all=Array.isArray(data.rows)?data.rows:[];const months=[...new Set(all.map(r=>month(r.starts_at)).filter(Boolean))].sort();document.querySelector('#month').innerHTML='<option value="all">Все месяцы</option>'+months.map(m=>`<option value="${m}">${new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(new Date(m+'-01T12:00:00Z'))}</option>`).join('');document.querySelector('#month').addEventListener('change',render);document.querySelector('#sync').textContent=data.generated_at?`Обновлено: ${new Date(data.generated_at).toLocaleString('ru-RU')}. Записей: ${all.length}.`:'Snapshot ещё не опубликован локальным сервером.';document.querySelector('#state').textContent=data.generated_at?'SYNCED':'WAITING';render();}catch(e){const box=document.querySelector('#sync');box.classList.add('error');box.textContent='Не удалось загрузить snapshot: '+e.message;document.querySelector('#rows').innerHTML='<tr><td colspan="6" class="empty">Данные временно недоступны.</td></tr>';document.querySelector('#state').textContent='ERROR';}}
load();
</script></body></html>
