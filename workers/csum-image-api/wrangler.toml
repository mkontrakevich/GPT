name = "csum-nn-image-studio"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
SITE_URL = "https://mkontrakevich.github.io/GPT/"
# For production you may restrict CORS:
# ALLOWED_ORIGIN = "https://mkontrakevich.github.io"

[[r2_buckets]]
binding = "CSUM_IMAGES"
bucket_name = "csum-nn-images"

# Secrets (never commit values):
# wrangler secret put OPENROUTER_API_KEY
# wrangler secret put ADMIN_TOKEN
